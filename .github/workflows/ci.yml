name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  # Pinned, auditable toolchain: refuse to silently download/switch Go versions.
  # The build fails loudly instead of fetching a different toolchain.
  GOTOOLCHAIN: local

jobs:
  build-and-test:
    name: build / vet / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.4'
          cache: true

      - name: Verify pinned Go toolchain
        run: |
          if grep -q '^toolchain ' go.mod; then
            echo "::error::unexpected toolchain directive in go.mod — pinned Go must change only by deliberate human PR"
            grep '^toolchain ' go.mod
            exit 1
          fi
          if ! grep -q '^go 1\.26\.4$' go.mod; then
            echo "::error::go directive in go.mod drifted from the pinned 1.26.4"
            grep '^go ' go.mod
            exit 1
          fi
          echo "Pinned Go invariant holds: go 1.26.4, no toolchain directive."

      - name: Verify modules are tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum 2>/dev/null)" ]; then
            echo "::error::go.mod/go.sum not tidy — run 'go mod tidy' and commit the result"
            git --no-pager diff go.mod go.sum 2>/dev/null || true
            exit 1
          fi
          echo "Modules are tidy."

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

  govulncheck:
    name: security / govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.4'
          cache: true

      - name: Run govulncheck
        run: go tool govulncheck ./...

  gosec:
    name: security / gosec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.4'
          cache: true

      - name: Run gosec
        run: go tool gosec -nosec-require-rules -nosec-require-justification ./...

  staticcheck:
    name: quality / staticcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.4'
          cache: true

      - name: Run staticcheck
        run: go tool staticcheck ./...

  sbom-drift:
    name: supply-chain / sbom-drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.4'
          cache: true

      - name: Verify committed SBOM matches regenerated SBOM
        run: |
          # Regenerate with the EXACT invocation that produced sbom/bom.json.
          go tool cyclonedx-gomod mod -json -noserial -notimestamp -licenses -output /tmp/bom.ci.json .
          # The MAIN component's version is a git-HEAD-derived pseudo-version
          # (v0.0.0-<ts>-<sha>) that changes with every commit — including the
          # commit that adds the SBOM itself — so it can never match across
          # commits. Normalize each file's OWN main pseudo-version (exact
          # string, all occurrences) before diffing. Transitive pseudo-versions
          # come from go.mod and remain fully drift-detectable. Once a release
          # tag exists, the version becomes the stable tag and this is a no-op.
          norm() {
            v=$(grep -oEm1 'agentic_ai_engineering_with_go@v0\.0\.0-[0-9]{14}-[0-9a-f]{12}' "$1" | sed 's/.*@//')
            if [ -n "$v" ]; then sed "s|$v|MAIN-VERSION-NORMALIZED|g" "$1"; else cat "$1"; fi
          }
          if ! diff -u <(norm sbom/bom.json) <(norm /tmp/bom.ci.json); then
            echo "::error::sbom/bom.json is stale — it no longer matches the module graph. Regenerate and commit: go tool cyclonedx-gomod mod -json -noserial -notimestamp -licenses -output sbom/bom.json ."
            exit 1
          fi
          echo "Committed SBOM is current (main-module pseudo-version normalized)."
