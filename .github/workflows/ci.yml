name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

env:
  # Pinned, auditable toolchain: refuse to silently download/switch Go versions.
  # The build fails loudly instead of fetching a different toolchain.
  GOTOOLCHAIN: local

jobs:
  build-and-test:
    name: build / vet / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.1'
          cache: true

      - name: Verify pinned Go toolchain
        run: |
          if grep -q '^toolchain ' go.mod; then
            echo "::error::unexpected toolchain directive in go.mod — pinned Go must change only by deliberate human PR"
            grep '^toolchain ' go.mod
            exit 1
          fi
          if ! grep -q '^go 1\.26\.1$' go.mod; then
            echo "::error::go directive in go.mod drifted from the pinned 1.26.1"
            grep '^go ' go.mod
            exit 1
          fi
          echo "Pinned Go invariant holds: go 1.26.1, no toolchain directive."

      - name: Verify modules are tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum 2>/dev/null)" ]; then
            echo "::error::go.mod/go.sum not tidy — run 'go mod tidy' and commit the result"
            git --no-pager diff go.mod go.sum 2>/dev/null || true
            exit 1
          fi
          echo "Modules are tidy."

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

  govulncheck:
    name: security / govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.1'
          cache: true

      - name: Run govulncheck
        run: go tool govulncheck ./...

  gosec:
    name: security / gosec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.1'
          cache: true

      - name: Run gosec
        run: go tool gosec -nosec-require-rules -nosec-require-justification ./...

  staticcheck:
    name: quality / staticcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.1'
          cache: true

      - name: Run staticcheck
        run: go tool staticcheck ./...
