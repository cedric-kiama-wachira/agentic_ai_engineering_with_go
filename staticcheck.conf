# Staticcheck configuration — Agentic AI Lab (Go)
#
# Policy: gate on every DEFECT-detecting check at full strictness — bugs (SA),
# simplifications (S), and dead/unused code (U) — while leaving SUBJECTIVE STYLE
# checks to human review rather than as merge-blockers. This is the community
# default (staticcheck's own, the Go team's vscode-go default, and common
# production practice): maximal objective coverage, no arbitrary style gating.
#
# The six exclusions below are the style/opinion checks the staticcheck author
# and the Go team disable by default as too subjective to gate on:
#   -ST1000  Incorrect or missing package comment
#   -ST1003  Poorly chosen identifier (e.g. initialism capitalization: Id vs ID)
#   -ST1016  Use consistent method receiver names
#   -ST1020  Comment on exported function should start with the function's name
#   -ST1021  Comment on exported type should start with the type's name
#   -ST1022  Comment on exported var/const should start with its name
#
# These are NOT correctness concessions — SA/S/U all run at full strength.
# Re-enabling the documentation checks (ST1000, ST1020–ST1022) is a reasonable
# FUTURE house-style decision for this heavily-documented, regulated codebase,
# to be made deliberately as a style policy — not folded into the correctness
# baseline now.
#
# Deliberate, justified exceptions use an inline directive that is reviewable in
# the diff and visible in history (analogous to the gosec #nosec model):
#   //lint:ignore <CheckID> <reason>
checks = ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
